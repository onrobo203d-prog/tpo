<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信用BGMツール</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
}
#clock{
  font-size:56px;
  margin:30px;
  transition:0.3s;
}
.red{
  color:red;
}
button{
  padding:10px 20px;
  margin:5px;
  font-size:16px;
}
input{
  padding:8px;
  width:250px;
}
iframe{
  margin-top:10px;
}
</style>
</head>
<body>

<h1>配信用BGMツール</h1>

<div id="clock">--:--:--</div>

<button onclick="toggleNormal()">通常BGM</button>
<button onclick="playZui()">ズイズイBGM</button>

<br><br>

<input type="text" id="ytUrl" placeholder="YouTube URL（任意）">
<button onclick="loadYouTube()">YouTube読込</button>

<div id="ytPlayer"></div>

<script>
// =====================
// 状態管理
// =====================
let state = "IDLE"; 
// IDLE / NORMAL / ZUI / SE

let normalMode = "local";
let redTimeout = null;

// =====================
// Audio定義
// =====================
const normalAudio = new Audio("normal.mp3");
normalAudio.loop = true;

const zuiAudio = new Audio("zui.mp3");
const seAudio = new Audio("se.mp3");

// iPhone対策（最初のクリックで有効化）
document.addEventListener("click", () => {
  normalAudio.load();
  zuiAudio.load();
  seAudio.load();
}, { once:true });

// =====================
// 通常BGM
// =====================
function toggleNormal(){

  if(state === "NORMAL"){
    stopNormal();
    state = "IDLE";
    return;
  }

  if(state !== "IDLE") return;

  state = "NORMAL";

  if(normalMode === "local"){
    normalAudio.currentTime = 0;
    normalAudio.play();
  }else{
    playYouTube();
  }
}

function stopNormal(){
  normalAudio.pause();
  stopYouTube();
}

// =====================
// ズイズイBGM
// =====================
function playZui(){
  if(state !== "IDLE" && state !== "NORMAL") return;

  stopNormal();

  state = "ZUI";
  zuiAudio.currentTime = 0;
  zuiAudio.play();
}

// =====================
// SE
// =====================
function playSE(){
  state = "SE";

  zuiAudio.pause();
  zuiAudio.currentTime = 0;

  seAudio.currentTime = 0;
  seAudio.play();
}

seAudio.addEventListener("ended",()=>{
  state = "IDLE";
});

// =====================
// 時計＆赤6秒ロジック
// =====================
function updateClock(){

  const now = new Date();
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  const minuteNum = now.getMinutes();
  const secondNum = now.getSeconds();

  const clock = document.getElementById("clock");
  clock.textContent = `${h}:${m}:${s}`;

  // 3分ごとの00秒に発火
  if(minuteNum % 3 === 0 && secondNum === 0){

    // 赤表示
    clock.classList.add("red");

    // 6秒後に戻す
    if(redTimeout) clearTimeout(redTimeout);
    redTimeout = setTimeout(()=>{
      clock.classList.remove("red");
    },6000);

    // ズイズイ中なら停止してSE再生
    if(state === "ZUI"){
      playSE();
    }
  }
}

setInterval(updateClock,1000);
updateClock();

// =====================
// YouTube対応（簡易版）
// =====================
function loadYouTube(){
  const url = document.getElementById("ytUrl").value;
  const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
  if(!match) return alert("URL不正");

  const videoId = match[1];

  document.getElementById("ytPlayer").innerHTML =
    `<iframe width="300" height="170"
    src="https://www.youtube.com/embed/${videoId}?enablejsapi=1&loop=1&playlist=${videoId}"
    frameborder="0" allow="autoplay"></iframe>`;

  normalMode = "youtube";
}

function playYouTube(){
  const iframe = document.querySelector("#ytPlayer iframe");
  if(!iframe) return;
  iframe.src += "&autoplay=1";
}

function stopYouTube(){
  const iframe = document.querySelector("#ytPlayer iframe");
  if(!iframe) return;
  iframe.src = iframe.src.replace("&autoplay=1","");
}

</script>
</body>
</html>
