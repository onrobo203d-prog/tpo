<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGM & 跳ねタイマー</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

#clock{
  font-size:clamp(40px,8vw,72px);
  margin:30px 0;
  transition:0.3s;
}

.red{ color:red; }

.controls{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

select,button{
  padding:10px;
  font-size:16px;
  min-width:220px;
}
</style>
</head>
<body>

<h1>BGM & 跳ねタイマー</h1>
<div id="clock">--:--:--</div>
<h6>00、03、06、09、12、15、18、21、24、27</h6>
<h6>30、33、36、39、42、45、48、51、54、57</h6>
<div class="controls">

  <h3>通常BGM</h3>
  <select id="normalSelect"></select>
  <button id="normalBtn" disabled>再生</button>

  <h3>ズイズイBGM</h3>
  <select id="zuiSelect"></select>
  <button id="zuiBtn" disabled>再生</button>

</div>
<h5>登録されているBGMは全てフリー音源として使用できます。</h5>
<h5>跳ねるタイミングで時間表示が赤く表示されます。</h5>

<script>

// =====================
// Audio
// =====================
const normalAudio = new Audio();
normalAudio.loop = true;

const zuiAudio = new Audio();

let state = "IDLE";
let redTimeout = null;

normalAudio.volume = 1;
zuiAudio.volume = 1;

// =====================
// JSON読み込み
// =====================
fetch("bgm.json")
.then(res => res.json())
.then(data => {

  populateSelect("normalSelect", data.normal, "BGM");
  populateSelect("zuiSelect", data.zui, "zuizui");

  document.getElementById("normalBtn").disabled = false;
  document.getElementById("zuiBtn").disabled = false;

})
.catch(err=>{
  alert("bgm.json読み込み失敗");
  console.error(err);
});

function populateSelect(selectId, list, folder){
  const select = document.getElementById(selectId);
  select.innerHTML = "";

  list.forEach(file=>{
    const option = document.createElement("option");

    // パス（日本語対応）
    option.value = folder + "/" + encodeURIComponent(file);

    // 🔥 拡張子を除去して表示
    const displayName = file.replace(/\.[^/.]+$/, "");
    option.textContent = displayName;

    select.appendChild(option);
  });
}

// =====================
// 通常BGM
// =====================
document.getElementById("normalBtn").addEventListener("click",()=>{

  const btn = document.getElementById("normalBtn");

  if(state === "NORMAL"){
    stopNormal();
    state = "IDLE";
    btn.textContent = "再生";
    return;
  }

  if(state !== "IDLE") return;

  stopZui();

  const src = document.getElementById("normalSelect").value;
  if(!src) return;

  normalAudio.src = src;
  normalAudio.currentTime = 0;
  normalAudio.play();

  state = "NORMAL";
  btn.textContent = "停止";
});

function stopNormal(){
  normalAudio.pause();
  normalAudio.currentTime = 0;
  document.getElementById("normalBtn").textContent = "再生";
}

// =====================
// ズイズイBGM
// =====================
document.getElementById("zuiBtn").addEventListener("click",()=>{

  const btn = document.getElementById("zuiBtn");

  if(state === "ZUI"){
    stopZui();
    state = "IDLE";
    btn.textContent = "再生";
    return;
  }

  if(state !== "IDLE" && state !== "NORMAL") return;

  stopNormal();

  const src = document.getElementById("zuiSelect").value;
  if(!src) return;

  zuiAudio.src = src;
  zuiAudio.currentTime = 0;
  zuiAudio.play();

  state = "ZUI";
  btn.textContent = "停止";
});

function stopZui(){
  zuiAudio.pause();
  zuiAudio.currentTime = 0;
  document.getElementById("zuiBtn").textContent = "再生";
}

// =====================
// 時計
// =====================
function updateClock(){

  const now = new Date();
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  const clock = document.getElementById("clock");
  clock.textContent = `${h}:${m}:${s}`;

  if(now.getMinutes() % 3 === 0 && now.getSeconds() === 0){

    clock.classList.add("red");

    if(redTimeout) clearTimeout(redTimeout);
    redTimeout = setTimeout(()=>{
      clock.classList.remove("red");
    },6000);
  }
}

setInterval(updateClock,1000);
updateClock();

</script>
</body>
</html>
