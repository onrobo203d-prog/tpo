<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信用BGMツール</title>

<style>
body{
  margin:0;
  background:#111;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

#clock{
  font-size:clamp(40px,8vw,72px);
  margin:30px 0;
  transition:0.3s;
}

.red{
  color:red;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

button{
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}

.volumeBox{
  margin:15px 0;
}

input[type="range"]{
  width:200px;
}

iframe{
  width:90%;
  max-width:400px;
  aspect-ratio:16/9;
  margin-top:10px;
}
</style>
</head>
<body>

<h1>配信用BGMツール</h1>

<div id="clock">--:--:--</div>

<div class="controls">
  <button id="normalBtn" onclick="toggleNormal()">通常BGM 再生</button>
  <button id="zuiBtn" onclick="toggleZui()">ズイズイBGM 再生</button>
</div>

<div class="volumeBox">
  通常BGM音量
  <input type="range" min="0" max="1" step="0.01" value="1"
    oninput="normalAudio.volume=this.value">
</div>

<div class="volumeBox">
  ズイズイ音量
  <input type="range" min="0" max="1" step="0.01" value="1"
    oninput="setZuiVolume(this.value)">
</div>

<br>

<input type="text" id="ytUrl" placeholder="YouTube URL（任意）">
<button onclick="loadYouTube()">YouTube読込</button>

<div id="ytPlayer"></div>

<script>

// =====================
// 状態管理
// =====================
let state = "IDLE";
let normalMode = "local";
let redTimeout = null;
let autoStop = false; // 自動停止判定

// =====================
// Audio定義
// =====================
const normalAudio = new Audio("normal.mp3");
normalAudio.loop = true;

const zuiAudio = new Audio("zui.mp3");
const seAudio = new Audio("se.mp3");

// iOS対策
document.addEventListener("click", () => {
  normalAudio.load();
  zuiAudio.load();
  seAudio.load();
}, { once:true });

// =====================
// 音量連動
// =====================
function setZuiVolume(val){
  zuiAudio.volume = val;
  seAudio.volume = val; // SE連動
}

// =====================
// 通常BGM
// =====================
function toggleNormal(){

  const btn = document.getElementById("normalBtn");

  if(state === "NORMAL"){
    stopNormal();
    state = "IDLE";
    btn.textContent = "通常BGM 再生";
    return;
  }

  if(state !== "IDLE") return;

  state = "NORMAL";
  btn.textContent = "通常BGM 停止";

  if(normalMode === "local"){
    normalAudio.currentTime = 0;
    normalAudio.play();
  }else{
    playYouTube();
  }
}

function stopNormal(){
  normalAudio.pause();
  stopYouTube();
  document.getElementById("normalBtn").textContent = "通常BGM 再生";
}

// =====================
// ズイズイBGM
// =====================
function toggleZui(){

  const btn = document.getElementById("zuiBtn");

  if(state === "ZUI"){
    // 手動停止
    autoStop = false;
    stopZui();
    state = "IDLE";
    btn.textContent = "ズイズイBGM 再生";
    return;
  }

  if(state !== "IDLE" && state !== "NORMAL") return;

  stopNormal();

  state = "ZUI";
  btn.textContent = "ズイズイBGM 停止";

  zuiAudio.currentTime = 0;
  zuiAudio.play();
}

function stopZui(){
  zuiAudio.pause();
  zuiAudio.currentTime = 0;
  document.getElementById("zuiBtn").textContent = "ズイズイBGM 再生";
}

// =====================
// SE
// =====================
function playSE(){
  state = "SE";

  stopZui();

  seAudio.currentTime = 0;
  seAudio.play();
}

seAudio.addEventListener("ended",()=>{
  state = "IDLE";
});

// =====================
// 時計＆6秒赤表示
// =====================
function updateClock(){

  const now = new Date();
  const h = String(now.getHours()).padStart(2,"0");
  const m = String(now.getMinutes()).padStart(2,"0");
  const s = String(now.getSeconds()).padStart(2,"0");

  const minuteNum = now.getMinutes();
  const secondNum = now.getSeconds();

  const clock = document.getElementById("clock");
  clock.textContent = `${h}:${m}:${s}`;

  if(minuteNum % 3 === 0 && secondNum === 0){

    clock.classList.add("red");

    if(redTimeout) clearTimeout(redTimeout);
    redTimeout = setTimeout(()=>{
      clock.classList.remove("red");
    },6000);

    // ズイズイ自動停止
    if(state === "ZUI"){
      autoStop = true;
      playSE();
    }
  }
}

setInterval(updateClock,1000);
updateClock();

// =====================
// YouTube対応
// =====================
function loadYouTube(){
  const url = document.getElementById("ytUrl").value;
  const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/);
  if(!match) return alert("URL不正");

  const videoId = match[1];

  document.getElementById("ytPlayer").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${videoId}?enablejsapi=1&loop=1&playlist=${videoId}"
    frameborder="0" allow="autoplay"></iframe>`;

  normalMode = "youtube";
}

function playYouTube(){
  const iframe = document.querySelector("#ytPlayer iframe");
  if(!iframe) return;
  iframe.src += "&autoplay=1";
}

function stopYouTube(){
  const iframe = document.querySelector("#ytPlayer iframe");
  if(!iframe) return;
  iframe.src = iframe.src.replace("&autoplay=1","");
}

</script>
</body>
</html>
