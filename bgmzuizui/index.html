<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配信用BGMサイト</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#111;
  color:white;
  text-align:center;
}

#clock{
  font-size:48px;
  margin:20px 0;
}

.red{
  color:red;
}

button{
  padding:12px 20px;
  margin:10px;
  font-size:16px;
}

.slider{
  width:80%;
  max-width:300px;
}
</style>
</head>
<body>

<h1>配信用BGM</h1>

<div id="clock">00:00:00</div>

<h2>通常BGM</h2>
<input type="text" id="normalInput" placeholder="mp3/wavパス または YouTube URL">
<br>
<button id="normalBtn">再生</button>

<h2>ズイズイBGM</h2>
<input type="text" id="zuiInput" placeholder="mp3/wavパス または YouTube URL">
<br>
<button id="zuiBtn">再生</button>

<h3>音量</h3>
<input type="range" id="volume" class="slider" min="0" max="1" step="0.01" value="0.5">

<!-- Audio -->
<audio id="normalAudio" loop></audio>
<audio id="zuiAudio"></audio>

<!-- YouTube -->
<div id="ytNormal" style="display:none;"></div>
<div id="ytZui" style="display:none;"></div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
let normalAudio = document.getElementById("normalAudio");
let zuiAudio = document.getElementById("zuiAudio");

let normalBtn = document.getElementById("normalBtn");
let zuiBtn = document.getElementById("zuiBtn");

let volumeSlider = document.getElementById("volume");

let normalPlayer;
let zuiPlayer;

let isNormalPlaying = false;
let isZuiPlaying = false;

let redMode = false;
let redTimeout = null;

// =======================
// 時計処理
// =======================
function updateClock(){
  const now = new Date();
  let h = String(now.getHours()).padStart(2,"0");
  let m = String(now.getMinutes()).padStart(2,"0");
  let s = String(now.getSeconds()).padStart(2,"0");

  const clock = document.getElementById("clock");
  clock.textContent = `${h}:${m}:${s}`;

  const triggerMinutes = [0,3,6,9,12,15,18,21,24,27,30,33,36,39,42,45,48,51,54,57];

  if(triggerMinutes.includes(now.getMinutes()) && now.getSeconds() === 0){
    activateRed();
  }
}

function activateRed(){
  if(redMode) return;

  redMode = true;
  document.getElementById("clock").classList.add("red");

  // ズイズイ自動停止（SEなし）
  if(isZuiPlaying){
    stopZui(false); // false = ユーザー停止ではない
  }

  redTimeout = setTimeout(()=>{
    document.getElementById("clock").classList.remove("red");
    redMode = false;
  },6000);
}

setInterval(updateClock,1000);
updateClock();

// =======================
// 音量
// =======================
volumeSlider.addEventListener("input",()=>{
  normalAudio.volume = volumeSlider.value;
  zuiAudio.volume = volumeSlider.value;

  if(normalPlayer) normalPlayer.setVolume(volumeSlider.value*100);
  if(zuiPlayer) zuiPlayer.setVolume(volumeSlider.value*100);
});

// =======================
// YouTube API
// =======================
function onYouTubeIframeAPIReady(){
  normalPlayer = new YT.Player("ytNormal",{height:"0",width:"0"});
  zuiPlayer = new YT.Player("ytZui",{height:"0",width:"0"});
}

function getYouTubeID(url){
  const reg = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;
  const match = url.match(reg);
  return match ? match[1] : null;
}

// =======================
// 通常BGM
// =======================
normalBtn.onclick = function(){
  if(!isNormalPlaying){
    startNormal();
  }else{
    stopNormal();
  }
};

function startNormal(){
  stopZui(true);

  let input = document.getElementById("normalInput").value.trim();
  let ytID = getYouTubeID(input);

  if(ytID){
    normalPlayer.loadVideoById(ytID);
    normalPlayer.setLoop(true);
    normalPlayer.playVideo();
  }else{
    normalAudio.src = input;
    normalAudio.play();
  }

  isNormalPlaying = true;
  normalBtn.textContent = "停止";
}

function stopNormal(){
  normalAudio.pause();
  normalAudio.currentTime = 0;
  if(normalPlayer) normalPlayer.stopVideo();

  isNormalPlaying = false;
  normalBtn.textContent = "再生";
}

// =======================
// ズイズイBGM
// =======================
zuiBtn.onclick = function(){
  if(!isZuiPlaying){
    startZui();
  }else{
    stopZui(true);
  }
};

function startZui(){
  stopNormal();

  let input = document.getElementById("zuiInput").value.trim();
  let ytID = getYouTubeID(input);

  if(ytID){
    zuiPlayer.loadVideoById(ytID);
    zuiPlayer.playVideo();
  }else{
    zuiAudio.src = input;
    zuiAudio.play();
  }

  isZuiPlaying = true;
  zuiBtn.textContent = "停止";
}

function stopZui(userStop){
  zuiAudio.pause();
  zuiAudio.currentTime = 0;
  if(zuiPlayer) zuiPlayer.stopVideo();

  isZuiPlaying = false;
  zuiBtn.textContent = "再生";
}
</script>

</body>
</html>
