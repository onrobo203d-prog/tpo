<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嫁こな、ちょっと待った抽選</title>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        body {
            font-family: sans-serif;
            background: #f4f6f9;
            max-width: 900px;
            margin: 0 auto;
            padding: 12px;
        }

        h1 {
            text-align: center;
        }

        .section {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        input,
        select,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            border: none;
            color: white;
            background: #2196f3;
            cursor: pointer;
        }

        .green {
            background: #4caf50;
        }

        .red {
            background: #f44336;
        }

        .result {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            min-height: 70px;
        }

        .listener {
            background: #fafafa;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .rank1 { background: #fff4c2; }
        .rank2 { background: #eeeeee; }
        .rank3 { background: #ffe6cf; }
    </style>
</head>
<body>

<h1>嫁こな、ちょっと待った抽選カウンター</h1>

<div class="section">
    <h2>リスナー登録</h2>

    <input
        id="listenerInput"
        placeholder="リスナー名"
    >

    <button
        class="green"
        onclick="addListener()"
    >
        登録
    </button>
</div>

<div class="section">
    <h2>ポイント付与</h2>

    <select id="plusTarget"></select>

    <input
        id="pointAmount"
        type="number"
        value="1"
        min="1"
    >

    <button
        class="green"
        onclick="givePoints()"
    >
        ポイント付与
    </button>
</div>

<div class="section">
    <h2>抽選</h2>

    <button onclick="drawOne()">1回抽選</button>

    <input
        id="multiCount"
        type="number"
        value="5"
        min="1"
    >

    <button onclick="drawMultiple()">
        任意数抽選
    </button>
</div>

<div class="section">
    <h2>抽選結果</h2>
    <div id="result" class="result">待機中</div>
</div>

<div class="section">
    <h2>ランキング</h2>

    <button onclick="downloadRanking()">
        ランキングを画像保存
    </button>

    <div id="rankingArea">
        <div id="listenerList"></div>
    </div>
</div>

<div class="section">
    <button
        class="red"
        onclick="resetAll()"
    >
        全リセット
    </button>
</div>

<script>
let listeners = JSON.parse(localStorage.getItem('listeners') || '[]');

function save() {
    localStorage.setItem('listeners', JSON.stringify(listeners));
}

function addListener() {
    const name = listenerInput.value.trim();

    if (!name) return;

    if (listeners.some(x => x.name === name)) {
        return;
    }

    listeners.push({
        name,
        plus: 0,
        minus: 0
    });

    listenerInput.value = '';

    save();
    render();
}

function givePoints() {
    const index = Number(plusTarget.value);
    const amount = Math.max(1, parseInt(pointAmount.value) || 1);

    listeners[index].plus += amount;

    save();
    render();
}

function getSorted() {
    return [...listeners].sort((a, b) => {
        const totalA = a.plus - a.minus;
        const totalB = b.plus - b.minus;

        return totalB - totalA || b.plus - a.plus;
    });
}

function render() {
    listenerList.innerHTML = '';
    plusTarget.innerHTML = '';

    listeners.forEach((listener, index) => {
        plusTarget.innerHTML += `<option value="${index}">${listener.name}</option>`;
    });

    getSorted().forEach((listener, rank) => {
        const total = listener.plus - listener.minus;
        const originalIndex = listeners.indexOf(listener);

        const medal =
            rank === 0 ? '🥇' :
            rank === 1 ? '🥈' :
            rank === 2 ? '🥉' :
            `${rank + 1}位`;

        listenerList.innerHTML += `
            <div class="listener rank${rank + 1}">
                <strong>${medal} ${listener.name}</strong><br>
                ＋${listener.plus} ／ －${listener.minus} ／ 合計 ${total}<br><br>

                <button onclick="listeners[${originalIndex}].minus++; save(); render();">
                    －1
                </button>

                <button
                    class="red"
                    onclick="deleteListener(${originalIndex})"
                >
                    削除
                </button>
            </div>
        `;
    });
}

function deleteListener(index) {
    if (!confirm('削除しますか？')) return;

    listeners.splice(index, 1);

    save();
    render();
}

function drawOne() {
    if (!listeners.length) return;

    const winner = listeners[
        Math.floor(Math.random() * listeners.length)
    ];

    winner.minus++;

    result.innerHTML = `🏆 ${winner.name}`;

    save();
    render();
}

function drawMultiple() {
    const count = parseInt(multiCount.value) || 1;

    if (!listeners.length) return;

    const results = {};

    for (let i = 0; i < count; i++) {
        const winner = listeners[
            Math.floor(Math.random() * listeners.length)
        ];

        winner.minus++;

        results[winner.name] = (results[winner.name] || 0) + 1;
    }

    result.innerHTML =
        '🎉 ' + count + '回抽選<br>' +
        Object.entries(results)
            .sort((a, b) => b[1] - a[1])
            .map(v => `${v[0]} × ${v[1]}`)
            .join('<br>');

    save();
    render();
}

function resetAll() {
    if (!confirm('全データを削除しますか？')) return;

    listeners = [];

    save();

    result.textContent = '待機中';

    render();
}

function downloadRanking() {
    html2canvas(document.getElementById('rankingArea'))
        .then(canvas => {
            const link = document.createElement('a');

            link.href = canvas.toDataURL('image/png');
            link.download = 'ranking.png';

            link.click();
        });
}

document.addEventListener('DOMContentLoaded', () => {
    listenerInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') {
            addListener();
        }
    });

    render();
});
</script>

</body>
</html>
